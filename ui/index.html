<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kokoro TTS Voice Settings</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --text-heading: #f0f6fc;
    --primary: #238636;
    --primary-hover: #2ea043;
    --btn-secondary: #21262d;
    --accent: #58a6ff;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 24px;
    box-sizing: border-box;
  }
  .container {
    max-width: 520px;
    margin: 0 auto;
    background: var(--card);
    padding: 24px;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  h2 {
    margin-top: 0;
    color: var(--text-heading);
    font-size: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .form-group {
    margin-bottom: 20px;
  }
  label {
    display: block;
    margin-bottom: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-heading);
  }
  select, input[type="text"], input[type="range"] {
    width: 100%;
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-heading);
    font-size: 14px;
    box-sizing: border-box;
  }
  .range-container {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .range-value {
    font-size: 14px;
    font-weight: bold;
    color: var(--accent);
    min-width: 35px;
  }
  .checkbox-group {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  .checkbox-group input {
    width: 18px;
    height: 18px;
    accent-color: var(--primary);
  }
  .actions {
    display: flex;
    gap: 12px;
    margin-top: 24px;
  }
  button {
    flex: 1;
    padding: 10px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid transparent;
    transition: background 0.15s ease-in-out;
  }
  .btn-save {
    background: var(--primary);
    color: #fff;
  }
  .btn-save:hover {
    background: var(--primary-hover);
  }
  .btn-test {
    background: var(--btn-secondary);
    color: var(--text-heading);
    border-color: var(--border);
  }
  .btn-test:hover {
    background: #30363d;
  }
  .status {
    margin-top: 16px;
    font-size: 13px;
    text-align: center;
    color: var(--accent);
    min-height: 18px;
  }
</style>
</head>
<body>
<div class="container">
  <h2>🎙️ Kokoro Voice Settings</h2>
  
  <div class="form-group">
    <label for="voice">Voice Selection</label>
    <select id="voice">
      <optgroup label="American Female">
        <option value="af_sarah">Sarah (Warm, Natural - Default)</option>
        <option value="af_bella">Bella (Soft, Clear)</option>
        <option value="af_nicole">Nicole (Crisp, Professional)</option>
        <option value="af_sky">Sky (Dynamic)</option>
      </optgroup>
      <optgroup label="American Male">
        <option value="am_adam">Adam (Deep, Articulate)</option>
        <option value="am_michael">Michael (Friendly, Standard)</option>
      </optgroup>
      <optgroup label="British Female">
        <option value="bf_emma">Emma (Conversational British)</option>
        <option value="bf_isabella">Isabella (Articulate British)</option>
      </optgroup>
      <optgroup label="British Male">
        <option value="bm_george">George (Classic British)</option>
        <option value="bm_lewis">Lewis (Casual British)</option>
      </optgroup>
    </select>
  </div>

  <div class="form-group">
    <label for="speed">Speech Speed: <span id="speed-val" class="range-value">1.0x</span></label>
    <div class="range-container">
      <input type="range" id="speed" min="0.7" max="1.5" step="0.05" value="1.0">
    </div>
  </div>

  <div class="checkbox-group">
    <input type="checkbox" id="auto_read" checked>
    <label for="auto_read" style="margin-bottom:0; cursor:pointer;">Automatically read Copilot responses</label>
  </div>

  <div class="form-group">
    <label for="test-text">Sample Test Phrase</label>
    <input type="text" id="test-text" value="Hello! This is a test of your local neural voice.">
  </div>

  <div class="actions">
    <button class="btn-test" id="test-btn">▶️ Test Voice</button>
    <button class="btn-save" id="save-btn">Save Settings</button>
  </div>

  <div class="status" id="status-msg"></div>
</div>

<script>
  const voiceSelect = document.getElementById('voice');
  const speedSlider = document.getElementById('speed');
  const speedVal = document.getElementById('speed-val');
  const autoReadCheck = document.getElementById('auto_read');
  const testText = document.getElementById('test-text');
  const testBtn = document.getElementById('test-btn');
  const saveBtn = document.getElementById('save-btn');
  const statusMsg = document.getElementById('status-msg');

  speedSlider.addEventListener('input', () => {
    speedVal.textContent = speedSlider.value + 'x';
  });

  async function loadSettings() {
    try {
      const res = await fetch('/api/config');
      const data = await res.json();
      if (data.voice) voiceSelect.value = data.voice;
      if (data.speed) {
        speedSlider.value = data.speed;
        speedVal.textContent = data.speed + 'x';
      }
      if (data.auto_read !== undefined) autoReadCheck.checked = data.auto_read;
    } catch (e) {}
  }

  saveBtn.addEventListener('click', async () => {
    statusMsg.textContent = 'Saving...';
    const cfg = {
      voice: voiceSelect.value,
      speed: parseFloat(speedSlider.value),
      auto_read: autoReadCheck.checked
    };
    try {
      await fetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(cfg)
      });
      statusMsg.textContent = '✓ Settings saved!';
      setTimeout(() => statusMsg.textContent = '', 3000);
    } catch (err) {
      statusMsg.textContent = 'Error saving settings';
    }
  });

  testBtn.addEventListener('click', async () => {
    statusMsg.textContent = 'Playing test audio...';
    try {
      await fetch('/api/test-speech', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          text: testText.value,
          voice: voiceSelect.value,
          speed: parseFloat(speedSlider.value)
        })
      });
      statusMsg.textContent = '✓ Played audio';
      setTimeout(() => statusMsg.textContent = '', 3000);
    } catch (err) {
      statusMsg.textContent = 'Error playing audio';
    }
  });

  loadSettings();
</script>
</body>
</html>
